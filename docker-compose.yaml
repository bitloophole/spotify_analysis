version: "3.8"

services:
  spark-master:
    build: .
    image: spark-with-panda-new:3.5
    container_name: spark-master-spotify
    hostname: spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    environment:
      - SPARK_MODE=master
      - SPARK_MASTER_HOST=spark-master
      - SPARK_MASTER_PORT=7077
      - SPARK_MASTER_WEBUI_PORT=8080
      - SPARK_CONF_DIR=/opt/spark/conf
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./spark-apps:/opt/spark-apps
      - ./spark-data/master:/opt/spark-data
      - ./spark-shared:/opt/spark-shared

  spark-worker-1:
    image: spark-with-panda-new:3.5
    container_name: spark-worker-1-spotify
    hostname: spark-worker-1
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_WEBUI_PORT=8081
      - SPARK_CONF_DIR=/opt/spark/conf
    ports:
      - "8081:8081"
    depends_on:
      - spark-master
    volumes:
      - ./spark-apps:/opt/spark-apps
      - ./spark-data/worker1:/opt/spark-data
      - ./spark-shared:/opt/spark-shared

  spark-worker-2:
    image: spark-with-panda-new:3.5
    container_name: spark-worker-2-spotify
    hostname: spark-worker-2
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    environment:
      - SPARK_WORKER_CORES=2
      - SPARK_WORKER_MEMORY=2g
      - SPARK_WORKER_WEBUI_PORT=8081
      - SPARK_CONF_DIR=/opt/spark/conf
    ports:
      - "8082:8081"
    depends_on:
      - spark-master
    volumes:
      - ./spark-apps:/opt/spark-apps
      - ./spark-data/worker2:/opt/spark-data
      - ./spark-shared:/opt/spark-shared
